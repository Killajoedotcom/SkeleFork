
#####################################################################
#   Print Start
#####################################################################

## Orca Slicer and Prusa Slicer start gcode:
##
## print_start tool_0_start={first_layer_temperature[0]} tool_1_start={first_layer_temperature[1]} BED={first_layer_bed_temperature[0]} initial_tool={initial_tool} isT0={is_extruder_used[0]} isT1={is_extruder_used[1]}
##

## To enable ooze prevention and have the tool head heat up before the carriage picks up the tool:
## add the following line to "Toolchange Gcode" (Important for Prusa Slicer!!!)
##
## M104 S{temperature[next_extruder]} T{next_extruder}
##

[gcode_macro print_start]
gcode:
  {% set t0_start = params.TOOL_0_START %}
  {% set t1_start = params.TOOL_1_START %}
  {% set bed_temp = params.BED %}
  {% set t0_used = params.IST0|upper %}
  {% set t1_used = params.IST1|upper %}
  # Head off tool head heatup to prevent oozing
  {% if t1_used == "TRUE" %}
    M104 S150 T1
  {% endif %}
  # Always head off T0, it is the probing tool head.
  M104 S150 T0
  # Make sure bed is at printing temperature, only necessary if the slicer has not sent over the gcode to set the bed temp. prior to calling print_start.
  M190 S{bed_temp}
  # Make sure T0 is at probing temps before moving forward.
  M109 S150 T0
  # Home the printer if not already done. 
  SMART_HOMING
  # Perform a bed mesh
  BED_MESH_CALIBRATE ADAPTIVE=1

  ## Move T0 to a spot for heating up without oozing too much on the print area.
  G0 X5 Y5 Z10
  
  # Heat up only the nozzles used to printing temp
  {% if t1_used == "TRUE" %}
    M104 S{t1_start} T1
    {% if t0_used == "TRUE" %}
      M109 S{t0_start} T0
    {% else %}
      M104 S0 T0
      M109 S{t1_start} T1
    {% endif %}
  {% else %}
    M104 S0 T1
    M109 S{t0_start} T0
  {% endif %}
  
  # Here is wher I prime the used tools and set the first one used as the last one primed.
  # If T1 is used and T0 is the starting tool, prime T1 first.
  {% if t1_used == "TRUE" and params.INITIAL_TOOL|int == 0 %}
    # Switch to T1 and prime
    RESPOND MSG="Priming T1 and T0"
    T1
    PRIME_ACTIVE_TOOL T=1
    T0
    PRIME_ACTIVE_TOOL T=0
  # If T1 is used and T1 is the starting tool
  {% elif t1_used =="TRUE" and params.INITIAL_TOOL|int == 1 %}
    # If T0 is used, prime it first
    {% if t0_used == "TRUE" %}
      RESPOND MSG="Priming T0 and T1"
      T0
      PRIME_ACTIVE_TOOL T=0
      T1
      PRIME_ACTIVE_TOOL T=1
    {% else %}
      # T0 is not used, prime T1 only
      RESPOND MSG="Priming T1"
      T1
      PRIME_ACTIVE_TOOL T=1
    {% endif %}
  {% else %}
    # T1 is NOT used in the print, prime T0 only
    RESPOND MSG="Priming T0"
    T0
    PRIME_ACTIVE_TOOL T=0
  {% endif %}

#####################################################################
#  Printer End
#####################################################################

[gcode_macro print_end]
gcode:
  {% set z_end_hop = 5.0|float %}
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set cur_z = printer.toolhead.position[2]|float %}
  {% set park_y = printer.configfile.config["stepper_y"]["position_max"]|float - 10 %}
  ## Switch to T0 if T1 was the last to print.
  T0
  ## Move 5 mm up to avoid crashing into the print if z height is available.
  G0 Z{ [cur_z+z_end_hop, max_z]|min }
  ## Move toolhead to the rear
  G0 Y{park_y}
  ## Turn off heaters
  TURN_OFF_HEATERS
  ## Turn off part fans
  M107
  ## Turn off motors
  M84

#####################################################################
#  Printer Sleep - Shuts downs motors, fans and lights
#####################################################################

[gcode_macro printer_sleep]
description: Shutdown all lights, heaters, and motors for the printer.
gcode:
    # Shutdown the tool head LEDs.
    {% if printer["neopixel th_leds_t0"] is defined %}
      SET_LED LED=th_leds_t0 RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1
    {% endif %}
    {% if printer["neopixel th_leds_t1"] is defined %}
      SET_LED LED=th_leds_t1 RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1
    {% endif %}
    # Shut off chamber LEDs.
    {% if printer["neopixel chamber_light"] is defined %}
      SET_LED LED=chamber_light RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
    {% endif %}
    # Turn off motors.
    M84
    # Turn off part fans.
    M107
    {% if printer["fan_generic bed_fan"] is defined %}
      SET_FAN_SPEED FAN=bed_fan SPEED=0
    {% endif %}
    # Turn off all heaters
    TURN_OFF_HEATERS

#####################################################################
##  Klipper Backup
#####################################################################
[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True

#####################################################################
##  Nudge
#####################################################################

[gcode_macro NUDGE_MOVE_OVER_PROBE]
gcode:
  G0 Z3
  # Put your specific values here!
  # Update them too, after the first run.
  G0 X90 F9000
  G0 Y0 F9000

[gcode_macro NUDGE_FIND_TOOL_OFFSET]
gcode:
  NUDGE_MOVE_OVER_PROBE
  TOOL_LOCATE_SENSOR

[gcode_macro NUDGE_FIND_TOOL_OFFSETS]
gcode:
    T0
    M109 T0 S150  # Heat up as much as possible without oozing to account for any thermal deformations
    NUDGE_FIND_TOOL_OFFSET
    M104 T0 S0
    # Match your number of tools:
    #   [1, 2, 3] for a 4-head toolchanger.
    #   [1] for IDEX or Dual Gantry.
    {% for tool in [1] %}
        T{tool}
        M109 T{tool} S150
        NUDGE_MOVE_OVER_PROBE
        TOOL_CALIBRATE_TOOL_OFFSET
        M104 T{tool} S0
    {% endfor %}

#####################################################################
##  Filament
#####################################################################
[gcode_macro LOAD_FILAMENT]
gcode:
   M83                            ; set extruder to relative
   # was 280 w/bowden

   G1 E40 F1800                  ; quickly load filament to down bowden
   G1 E20 F300                    ; slower extrusion for hotend path
   G1 E15 F150                    ; prime nozzle with filament
   M82                            ; set extruder to absolute
    
[gcode_macro UNLOAD_FILAMENT]
gcode:
   M83                            ; set extruder to relative
   G1 E3 F200                    ; extrude a little to soften tip
   G1 E-50 F1800                 ; retract filament completely
   G1 E-50 F1800                 ; retract filament completely
   G1 E-25 F1800                 ; retract filament completely
   M82                            ; set extruder to absolute

#####################################################################
#   M104
#####################################################################

[gcode_macro M104]
rename_existing: M104.1
description: [T<index>] [S<temperature>]
  Set tool temperature.
  T= Tool number, optional. If this parameter is not provided, the current tool is used.
  S= Target temperature
gcode:
    {% if params.T is defined %}
      {% set newparameters = "" %}
      {% set newparameters = newparameters ~ " T="~params.T %}
      {% if params.S is defined %}
        {% set newparameters = newparameters ~ " TARGET="~params.S %}
      {% endif %}
      SET_TOOL_TEMPERATURE{newparameters}
    {% else %}
      M104.1 {rawparams}
    {% endif %}

#####################################################################
#   M109
#####################################################################

[gcode_macro M109]
rename_existing: M109.1
description: [T<index>] [S<temperature>]
  Set tool temperature and wait.
  T= Tool number, optional. If this parameter is not provided, the current tool is used.
  S= Target temperature
gcode:
    {% if params.T is defined %}
      {% set newparameters = "" %}
      {% set newparameters = newparameters ~ " T="~params.T %}
      {% if params.S is defined %}
        {% set newparameters = newparameters ~ " TARGET="~params.S %}
      {% endif %}
      SET_TOOL_TEMPERATURE WAIT=1 {newparameters}
    {% else %}
      M109.1 {rawparams}
    {% endif %}

