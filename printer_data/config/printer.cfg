# This file contains common pin mappings for the BIGTREETECH SKRat V1.0.
# To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# See docs/Config_Reference.md for a description of parameters.
[include autotune_tmc.cfg]
# [include ebb36.cfg]
[include fluidd.cfg]
[include klipper-toolchanger/homing_override.cfg]
[include klipper-toolchanger/offset_save_file.cfg]
[include klipper-toolchanger/stealthburner_macros_tc.cfg]
[include klipper-toolchanger/tc_offset_calibration_macros.cfg]
[include klipper-toolchanger/tool_detection.cfg]
[include klipper-toolchanger/toolboard_0.cfg]
#[include klipper-toolchanger/toolboard_1.cfg]
#[include klipper-toolchanger/toolhead_1_as_primary.cfg]
[include klipper-toolchanger/toolchanger.cfg]
[include klipper-toolchanger/toolchanger_macros.cfg]
[include macros.cfg]
[include priming.cfg]

####################################################################
## MCUs
####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_btt-skrat-10-if00
restart_method: command

[mcu host]
serial: /tmp/klipper_host_mcu

#####################################################################
#  Printer Configuration
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
max_z_velocity: 10
max_z_accel: 30

####################################################################
## STEPPER CONFIGURATIONS
####################################################################

## Stepper X configuration
## ----------------------------------------
[stepper_x]
step_pin: PF9
dir_pin: !PD7
enable_pin: !PD6
endstop_pin: toolboard_0:PA15
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper

position_endstop: 180
position_min: 0
position_max: 180
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

## Stepper Y configuration
## ----------------------------------------
[stepper_y]
step_pin: PD3
dir_pin: !PD2
enable_pin: !PD5
# endstop_pin: ^PC1
endstop_pin: tmc2209_stepper_y:virtual_endstop
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper

position_endstop: 180
position_min: 0
position_max: 180
homing_speed: 80
homing_retract_dist: 0
homing_positive_dir: true
use_sensorless_homing: true

## Z Stepper - Left Z Motor configuration
## ----------------------------------------
[stepper_z]
step_pin: PA15
dir_pin: PF8
enable_pin: !PC9
# endstop_pin: ^PC0
endstop_pin: probe:z_virtual_endstop

microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
homing_speed: 8.0 
second_homing_speed: 3
homing_retract_dist: 3

##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
position_endstop: 1

# All builds use same Max Z
position_max: 150
position_min: -5

## Z1 Stepper - Rear Z Motor configuration
## ----------------------------------------
[stepper_z1]
step_pin: PC7
dir_pin: !PC6
enable_pin: !PD9
rotation_distance: 8    # For T8x8 integrated lead screw
microsteps: 16
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree

## Z2 Stepper - Right Z Motor configuration
## ----------------------------------------
[stepper_z2]
step_pin: PB10
dir_pin: PE15
enable_pin: !PA8
rotation_distance: 8    # For T8x8 integrated lead screw
microsteps: 16
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree

#####################################################################
#  Extruder PID settings, in here so we can save_config
#####################################################################

[extruder]
control: mpc
heater_power: 40
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.06
filament_heat_capacity: 1.3
# pid_Kp: 21.527
# pid_Ki: 1.063
# pid_Kd: 108.982
min_temp: 0
max_temp: 300

[extruder1]
control: mpc
heater_power: 40
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.06
filament_heat_capacity: 1.3
# pid_Kp: 21.527
# pid_Ki: 1.063
# pid_Kd: 108.982
min_temp: 0
max_temp: 300

#####################################################################
## BED HEATER
#####################################################################

[heater_bed]
heater_pin: PB3
sensor_type: ATC Semitec 104GT-2
sensor_pin: PB2
control: pid
max_power: 1.0
min_temp: 0
max_temp: 120
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

####################################################################
## Z TILT CONFIGURATION
####################################################################

[z_tilt]
z_positions:
    # For 180 build
    -50, -13
    90, 217
    213, -13
points:
    # For 180 build
    20, 10
    90, 155
    160, 10

speed: 200
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.02
max_adjust: 10

[probe]
pin: PC0
x_offset: 90
y_offset: 0.0
z_offset: -1
speed: 5.0
samples: 2
sample_retract_dist: 2.0
lift_speed: 50
samples_result: average
samples_tolerance: 0.100
samples_tolerance_retries: 3

####################################################################
## BED MESH CONFIGURATION
####################################################################

[bed_mesh]
speed: 200
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 170, 170  # For 180 build
probe_count: 5,5
algorithm: bicubic
fade_start: 0.6
fade_end: 10.0
zero_reference_position: 90, 90

####################################################################
## FAN CONFIGURATIONS
####################################################################
# Electronics cooling fan - Fan3
# ----------------------------------------
[controller_fan Electronics_Fan]
pin: PD12
stepper: stepper_x, stepper_y

# Bed fans - Fan2
# ----------------------------------------
[heater_fan Bed_Fans]
pin: PD13
heater: heater_bed
heater_temp: 80
fan_speed: 0.50

####################################################################
## TEMPERATURE CONFIGURATIONS
####################################################################
# Mainboard
#------------------------------------------
[temperature_sensor SKRat]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 80

# Compute module
# ----------------------------------------
[temperature_sensor RPi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

# [temperature_sensor chamber]
# sensor_type: Generic 3950
# sensor_pin: PF4
# min_temp: 0
# max_temp: 80

#####################################################################
##   Chamber LED
#####################################################################

# [neopixel chamber_light]
#pin: PE4
# chain_count: 29
# color_order: GRBW
# initial_RED: 0.5
# initial_GREEN: 0.5
# initial_BLUE: 0.5
# initial_WHITE: 0.5

########################################
## TMC2209 configuration
########################################

[tmc2209 stepper_x]
uart_pin: PF10
run_current: 0.800
sense_resistor: 0.110
interpolate: True

[tmc2209 stepper_y]
uart_pin: PD4
diag_pin: ^PC1
driver_SGTHRS: 255
run_current: 0.800
home_current: 0.49
current_change_dwell_time: 0.2
sense_resistor: 0.110
interpolate: True

[tmc2209 stepper_z]
uart_pin: PC8
run_current: 0.800
sense_resistor: 0.110
interpolate: True

[tmc2209 stepper_z1]
uart_pin: PD8
run_current: 0.800
sense_resistor: 0.110
interpolate: True

[tmc2209 stepper_z2]
uart_pin: PB11
run_current: 0.800
sense_resistor: 0.110
interpolate: True

####################################################################
## PERSONAL CONFIGURATIONS
####################################################################

[exclude_object]
 [force_move]
 enable_force_move: True
[idle_timeout]
timeout: 1800
[input_shaper]
[respond]
[save_variables]
filename: ~/printer_data/config/klipper-toolchanger/offset_save_file.cfg
[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

